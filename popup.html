<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Twitch Notify</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 260px;
      padding: 10px;
    }
    input, textarea {
      width: 100%;
      box-sizing: border-box;
    }
    textarea {
      height: 60px;
      resize: none;
    }
    button {
      width: 100%;
      margin-top: 8px;
      padding: 6px;
    }
    .status {
      margin-top: 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <h3>Twitch Notify</h3>

  <label>Telegram ID</label>
  <input id="telegramId" placeholder="7696397686">

  <label style="margin-top:6px; display:block;">Стримеры</label>
  <textarea id="streamers" placeholder="raidstacija0904, 66petarda_rus"></textarea>

  <button id="save">Сохранить</button>
  <div class="status" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
